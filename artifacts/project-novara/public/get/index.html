<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08111F" />
    <title>Get Novara</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      // The printed QR code points here, so where each device lands can change
      // without reprinting. When the app is live on Google Play, set ANDROID_URL to
      // https://play.google.com/store/apps/details?id=group.novaraconnect.app
      var IOS_URL = "https://apps.apple.com/app/id6811249861";
      var ANDROID_URL = "https://app.novaraconnect.group/start";
      var OTHER_URL = "https://app.novaraconnect.group/start";

      var ua = navigator.userAgent;
      // iPadOS reports itself as a Mac; touch support gives it away.
      if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
        location.replace(IOS_URL);
      } else if (/Android/.test(ua)) {
        location.replace(ANDROID_URL);
      } else {
        location.replace(OTHER_URL);
      }
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        box-sizing: border-box;
        background: #08111f;
        color: #aab7ca;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      a {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <p>Taking you to Novara…</p>
    <p>
      If nothing happens, open
      <a href="https://apps.apple.com/app/id6811249861">Novara on the App Store</a>
      or <a href="https://app.novaraconnect.group/start">the Novara website</a>.
    </p>
  </body>
</html>
